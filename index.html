<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CR Remover - Video Metadata Cleaner</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/ffmpeg.js@0.2.1/ffmpeg.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 CR Remover Tool</h1>
            <p>Video se Copyright Metadata Remove Karein</p>
        </header>

        <div class="upload-section">
            <div class="drop-zone" id="dropZone">
                <input type="file" id="videoInput" accept="video/*" hidden>
                <div class="upload-icon">📤</div>
                <h3>Video Upload Karein</h3>
                <p>Click karein ya drag & drop karein</p>
                <button class="btn-primary" onclick="document.getElementById('videoInput').click()">
                    Video Select Karein
                </button>
            </div>
        </div>

        <div class="video-info" id="videoInfo" style="display: none;">
            <div class="video-preview">
                <video id="videoPreview" controls></video>
            </div>
            <div class="metadata-section">
                <h3>📋 Purani Metadata</h3>
                <div id="oldMetadata"></div>
                
                <h3>🆕 Nayi Metadata Set Karein (Optional)</h3>
                <form id="metadataForm">
                    <div class="form-group">
                        <label>Title:</label>
                        <input type="text" id="newTitle" placeholder="Naya title">
                    </div>
                    <div class="form-group">
                        <label>Author:</label>
                        <input type="text" id="newAuthor" placeholder="Naya author">
                    </div>
                    <div class="form-group">
                        <label>Description:</label>
                        <textarea id="newDescription" placeholder="Nayi description"></textarea>
                    </div>
                    <button type="button" class="btn-primary" onclick="processVideo()">
                        🔄 Metadata Update Karein
                    </button>
                </form>
            </div>
        </div>

        <div class="progress-section" id="progressSection" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p id="progressText">Processing...</p>
        </div>

        <div class="download-section" id="downloadSection" style="display: none;">
            <h3>✅ Video Ready Hai!</h3>
            <button class="btn-success" id="downloadBtn">
                ⬇️ Updated Video Download Karein
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
